[project]
name = "fallguard-lite"
version = "0.1.0"
description = "Privacy-conscious person detection and temporal fall detection demo"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
